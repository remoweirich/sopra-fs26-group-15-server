runtime: java
env: flex

runtime_config:
  operating_system: ubuntu24
  runtime_version: "21"

manual_scaling:
  instances: 1

network:
  session_affinity: true

resources:
  cpu: 1
  memory_gb: 1.7
  disk_size_gb: 10

env_variables:
  GEOPS_API_KEY: "GEOP_API_KEY_PLACEHOLDER"
  BROKER_HOST: "BROKER_HOST_PLACEHOLDER"
  BROKER_USER: "BROKER_USER_PLACEHOLDER"
  BROKER_PASS: "BROKER_PASS_PLACEHOLDER"